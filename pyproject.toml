[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomfx"
version = "3.5.0"
description = "AxiomFX: Autonomous Quantitative Research Engine & Institutional 60-FPS Multi-Market Terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "numba>=0.59.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "requests>=2.31.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "output"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
